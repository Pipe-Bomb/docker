name: Docker (standalone)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and push
        required: true
        default: edge
        type: choice
        options: [edge, latest]
  repository_dispatch:
    types: [base-image-updated]
  push:
    branches: [master]
    tags: ["v*.*.*"]

env:
  IMAGE: ghcr.io/pipe-bomb/pipe-bomb

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve base image tags
        id: base-tags
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            TAG="${{ github.event.client_payload.tag }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            TAG="edge"
          else
            TAG="latest"
          fi
          echo "server_tag=$TAG" >> $GITHUB_OUTPUT
          echo "frontend_tag=$TAG" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable=${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || steps.base-tags.outputs.tag == 'edge' }}
            type=raw,value=latest,enable=${{ steps.base-tags.outputs.tag == 'latest' && github.event_name != 'push' }}
          labels: |
            org.opencontainers.image.description=Pipe Bomb

      - uses: docker/build-push-action@v5
        with:
          context: ./standalone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVER_TAG=${{ steps.base-tags.outputs.server_tag }}
            FRONTEND_TAG=${{ steps.base-tags.outputs.frontend_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
