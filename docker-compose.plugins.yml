services:
  api:
    depends_on:
      plugin-installer:
        condition: service_completed_successfully

  plugin-installer:
    image: node:24-slim
    command:
      - sh
      - -c
      - |
        apt-get update -qq && apt-get install -y -qq git > /dev/null

        install_plugin() {
          NAME=$$1
          REPO=$$2
          TARGET="/plugins/$$NAME"

          if [ -d "$$TARGET" ]; then
            echo "[$$NAME] already installed, skipping"
            return
          fi

          echo "[$$NAME] cloning..."
          git clone --depth=1 "$$REPO" /tmp/$$NAME

          echo "[$$NAME] building..."
          cd /tmp/$$NAME
          npm ci --silent
          npm run build --silent

          echo "[$$NAME] installing production dependencies..."
          npm ci --omit=dev --silent

          echo "[$$NAME] copying to plugins directory..."
          cp -r /tmp/$$NAME "$$TARGET"

          echo "[$$NAME] done"
        }

        install_plugin local-library https://github.com/Pipe-Bomb/local-library-plugin
        install_plugin chromaprint https://github.com/Pipe-Bomb/chromaprint-plugin
        install_plugin musicbrainz https://github.com/Pipe-Bomb/musicbrainz-plugin
        install_plugin discogs https://github.com/Pipe-Bomb/discogs-plugin
        install_plugin fanart-tv https://github.com/pipe-bomb/fanart-tv-plugin
        install_plugin format https://github.com/Pipe-Bomb/format-plugin

    volumes:
      - ${APPDATA_PATH:-./data}/plugins:/plugins
