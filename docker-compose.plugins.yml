services:
  api:
    depends_on:
      plugin-installer:
        condition: service_completed_successfully

  plugin-installer:
    image: node:24-slim
    command:
      - sh
      - -c
      - |
        apt-get update -qq && apt-get install -y -qq git > /dev/null

        install_plugin() {
          NAME=$$1
          REPO=$$2
          TARGET="/plugins/$$NAME"

          if [ -d "$$TARGET" ]; then
            echo "[$$NAME] already installed, skipping"
            return
          fi

          echo "[$$NAME] cloning..."
          git clone --depth=1 "$$REPO" /tmp/$$NAME

          echo "[$$NAME] building..."
          cd /tmp/$$NAME
          npm ci --silent
          npm run build --silent

          echo "[$$NAME] installing production dependencies..."
          npm ci --omit=dev --silent

          echo "[$$NAME] copying to plugins directory..."
          mkdir -p "$$TARGET"
          cp -r dist package.json node_modules "$$TARGET/"

          echo "[$$NAME] done"
        }

        install_plugin musicbrainz https://github.com/Pipe-Bomb/musicbrainz-plugin
    volumes:
      - ${APPDATA_PATH:-./data}/plugins:/plugins
