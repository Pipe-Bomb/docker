services:
  nginx:
    image: ghcr.io/pipe-bomb/proxy:latest
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  api-init:
    image: alpine
    command:
      - sh
      - -c
      - >-
        mkdir -p /data/data /data/resources /data/cache /data/plugin-cache /data/plugins /data/temp /data/secrets &&
        chown -R 100:101 /data &&
        chmod 750 /data/data /data/resources /data/cache &&
        chmod 777 /data/plugins /data/plugin-cache /data/temp &&
        chmod 700 /data/secrets
    volumes:
      - ${APPDATA_PATH:-./data}:/data
    restart: "no"

  api:
    image: ghcr.io/pipe-bomb/server:latest
    depends_on:
      api-init:
        condition: service_completed_successfully
    environment:
      BASE_PATH: /api
      CORS: ${PUBLIC_URL:-http://localhost}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      NODE_ENV: production
      DB_FILE: /app/data/pipe-bomb.sqlite
      # PostgreSQL (set DB_TYPE=postgres and fill in the rest to use instead)
      DB_TYPE: ${DB_TYPE:-sqlite}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-}
      DB_PASS: ${DB_PASS:-}
      DB_NAME: ${DB_NAME:-}
    volumes:
      - ${APPDATA_PATH:-./data}/data:/app/data
      - ${APPDATA_PATH:-./data}/resources:/app/resources
      - ${APPDATA_PATH:-./data}/cache:/app/audio-cache
      - ${APPDATA_PATH:-./data}/plugin-cache:/app/plugin-cache
      - ${APPDATA_PATH:-./data}/plugins:/app/plugins
      - ${APPDATA_PATH:-./data}/temp:/app/temp
      - ${APPDATA_PATH:-./data}/secrets:/app/.secrets
      # Bind-mount plugin binaries (yt-dlp, fpcalc, etc.) without rebuilding:
      # - /path/to/bin:/app/bin
      # Bind-mount your music library for the local-library plugin:
      # - ${MUSIC_PATH:-/path/to/music}:/music:ro
    restart: unless-stopped

  frontend:
    image: ghcr.io/pipe-bomb/frontend:latest
    environment:
      INTERNAL_API_URL: http://api:3000
    restart: unless-stopped
