server {
	listen 80;

	# Use Docker's internal DNS so upstreams are resolved per-request,
	# not at startup (prevents crash when api/frontend aren't ready yet)
	resolver 127.0.0.11 valid=10s;

	# Strip /api prefix before forwarding to the NestJS server
	location /api {
		set $upstream_api api:3000;
		rewrite ^/api/?(.*)$ /$1 break;
		proxy_pass http://$upstream_api;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# Disable buffering for HLS/audio streaming responses
		proxy_buffering off;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		client_max_body_size 100m;
	}

	location / {
		set $upstream_frontend frontend:3000;
		proxy_pass http://$upstream_frontend;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}
}
